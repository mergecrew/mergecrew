name: Deploy to VM (GHCR)

# Build all five service images, push them to GHCR tagged with the commit SHA
# and `latest`, then SSH into the production VM and run scripts/deploy-pull.sh
# to roll forward. Replaces the manual SSH + `./scripts/deploy.sh` workflow.

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'docker-compose.prod.yml'
      - 'scripts/deploy-pull.sh'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-vm.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ghcr.io/mergecrew

jobs:
  build-and-push:
    # main only (a manual dispatch from another branch must not ship it), and
    # the `prod` environment gates secrets to deployments from main.
    if: ${{ github.ref == 'refs/heads/main' && (vars.VM_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    environment: prod
    permissions:
      contents: read
      packages: write # push images to GHCR
    # The target VM is AWS Graviton (linux/arm64), so default to a native
    # arm runner; set the org RUNNER_ARM variable to `self-hosted` to route
    # back to the runner VM when it's up. If runner arch and platform ever
    # differ, QEMU (set up below) handles the cross-build. Adopters can
    # override via repo variables:
    #   RUNNER_ARM        = self-hosted | <any label>
    #   VM_BUILD_PLATFORM = linux/amd64                 (single arch)
    #                     | linux/amd64,linux/arm64    (multi-arch; needs QEMU,
    #                                                   which is set up below)
    runs-on: ${{ vars.RUNNER_ARM || 'ubuntu-24.04-arm' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api, orchestrator, runner, worker-cron, web]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only needed when building for a platform other than the runner's
      # native arch (e.g. amd64 runner producing an arm64 image, or any
      # multi-arch build). No-op when platforms == runner arch.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          platforms: ${{ vars.VM_BUILD_PLATFORM || 'linux/arm64' }}
          tags: |
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-and-push
    # main only (a manual dispatch from another branch must not ship it), and
    # the `prod` environment gates secrets to deployments from main.
    if: ${{ github.ref == 'refs/heads/main' && (vars.VM_DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}
    environment: prod
    runs-on: ${{ vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    steps:
      - name: Compute image tag
        id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # We rely on the VM having the repo cloned at ${{ vars.VM_REPO_PATH }}
      # (default /home/ec2-user/data/mergecrew). The deploy step fast-forwards
      # the working tree to the commit being shipped so docker-compose.prod.yml
      # and scripts/deploy-pull.sh on disk match the images we just pushed.
      - name: SSH deploy
        env:
          VM_REPO_PATH: ${{ vars.VM_REPO_PATH || '/home/ec2-user/data/mergecrew' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Pin the server's host key so a hijacked DNS/IP can't receive the
          # deploy key session. `ssh-keyscan -t ed25519 <host> | ssh-keygen -lf -`
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          envs: GITHUB_SHA,VM_REPO_PATH
          script: |
            set -euo pipefail
            cd "$VM_REPO_PATH"
            git fetch --quiet origin main
            git checkout --quiet "$GITHUB_SHA"
            ./scripts/deploy-pull.sh "${GITHUB_SHA:0:12}"

      - name: Summarize
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### VM deploy"
            echo ""
            echo "- branch: \`$REF_NAME\`"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- tag pushed: \`$IMAGE_TAG\`"
            echo "- result: $JOB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
