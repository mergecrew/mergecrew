name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Pull requests (incl. forks of this public repo) always run on a
    # GitHub-hosted runner; only trusted pushes to main may be routed to a
    # runner chosen via RUNNER_DEFAULT. Never point PR jobs at self-hosted.
    runs-on: ${{ github.event_name == 'push' && vars.RUNNER_DEFAULT || 'ubuntu-latest' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mergecrew
          POSTGRES_PASSWORD: mergecrew
          POSTGRES_DB: mergecrew
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mergecrew -d mergecrew"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://mergecrew:mergecrew@localhost:5432/mergecrew?schema=public
      DATABASE_MIGRATE_URL: postgresql://mergecrew:mergecrew@localhost:5432/mergecrew?schema=public
      REDIS_URL: redis://localhost:6379
      KMS_MASTER_KEY: base64:0000000000000000000000000000000000000000000=
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # Three self-hosted runners share one host. Install pnpm and its content
      # store under the per-runner RUNNER_TEMP so concurrent jobs can't clobber
      # a shared install (action default is ~/setup-pnpm) or race the store.
      # Harmless on GitHub-hosted runners too.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
      # No setup-node `cache: pnpm`: it resolves the store via a shared host
      # path that races across the co-located runners. The per-runner store
      # below sits on the same volume as the workspace, so linking is fast.
      - run: pnpm install --frozen-lockfile=false --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Bootstrap Postgres roles + extensions
        # Run psql from a container so the step doesn't depend on the runner
        # image shipping postgresql-client. --network host reaches the service
        # container's mapped 5432 the same way `localhost` does on the host.
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=mergecrew \
            -v "$PWD/infra/sql/init:/sql:ro" \
            postgres:16-alpine \
            psql -h localhost -U mergecrew -d mergecrew -f /sql/00-roles.sql
      - run: pnpm --filter @mergecrew/db generate
      - run: pnpm --filter @mergecrew/db migrate
      - run: pnpm typecheck
      - run: pnpm build
      - name: Skills path-gate (#580 / #554 T-10)
        run: pnpm --filter @mergecrew/skills lint:fs-gate
      - name: Raw SQL chokepoint (#582 / #554 T-9)
        run: pnpm lint:no-raw-sql
      - run: pnpm run --if-present test
      - name: OpenAPI spec is up to date
        run: |
          pnpm --filter @mergecrew/api openapi:export
          git diff --exit-code -- docs/openapi.json || {
            echo "::error::docs/openapi.json is stale. Run 'pnpm --filter @mergecrew/api openapi:export' and commit the result."
            exit 1
          }
      - name: SDK types are regenerated from the spec
        run: |
          pnpm --filter @mergecrew/sdk generate
          git diff --exit-code -- packages/sdk-ts/src/generated.ts || {
            echo "::error::packages/sdk-ts/src/generated.ts is stale. Run 'pnpm --filter @mergecrew/sdk generate' and commit the result."
            exit 1
          }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'
      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest
      - name: Install Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v3.16.0
      - name: helm lint
        run: helm lint infra/helm/mergecrew
      - name: helm template (renders without error)
        run: |
          helm template mergecrew infra/helm/mergecrew \
            --set image.api.tag=v0.0.0 \
            --set image.orchestrator.tag=v0.0.0 \
            --set image.runner.tag=v0.0.0 \
            --set image.workerCron.tag=v0.0.0 \
            --set image.web.tag=v0.0.0 \
            > /tmp/helm-render.yaml
          test -s /tmp/helm-render.yaml
